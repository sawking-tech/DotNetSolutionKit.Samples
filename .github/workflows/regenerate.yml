name: Regenerate

# On a release, and never on a clock: a release of the template publishes its packages and then wakes this
# workflow by a repository_dispatch from samples-dispatch.yml there (issue #134). What reaches master is a
# release, tagged by its release.yml, so the newest tag is the release these samples follow: a branch with a
# "ref" in variants.json (full-dev, on dev) follows that branch of the template instead, and a row with
# "tag": false (lifecycle) is for the site's list of branches only - lifecycle.yml owns it and regenerates it.
#
# The cron was the half-hourly poll released.yml ran instead of a dispatch, and the dispatch replaced it: a run
# on a clock rebuilds nothing that a release has not already asked for, and costs minutes every hour.
#
# The branches carry workflow files, which GITHUB_TOKEN may not push, and a push by GITHUB_TOKEN starts no
# workflows. The push uses SAMPLES_DEPLOY_KEY, a deploy key of this repository with write access: it does
# not expire, and its push starts the branch's CI like any other push.
#
# This file lives on the default branch, which is a sample too: generate.sh puts it back on each
# regeneration, with the rest of the automation in .samples/.

on:
  # samples-dispatch.yml of the template fires this on a release, with the tag as the payload.
  repository_dispatch:
    types: [released]
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the latest release is already here
        type: boolean
        default: false

permissions:
  contents: read

env:
  TEMPLATE_REPO: sawking-tech/DotNetSolutionKit

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      regenerate: ${{ steps.release.outputs.regenerate }}
      branches: ${{ steps.release.outputs.branches }}
    steps:
      - uses: actions/checkout@v7
      # The gate: the canary proves the runner's SDK still generates, builds and tests the template.
      # When it is red the environment is the suspect, not the template, and a regeneration would push
      # a branch broken by the environment and paint the samples board with it.
      - name: The environment holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/canary.yml/runs?per_page=1")
          conclusion=$(jq -r '.workflow_runs[0].conclusion // "none"' <<< "$json")
          url=$(jq -r '.workflow_runs[0].html_url // ""' <<< "$json")
          case "$conclusion" in
            success) echo "the canary is green: $url" ;;
            none) echo "the canary has not run yet; the first run decides from now on" ;;
            *) echo "::error title=The canary is red::The environment broke the template; this run is held until canary.yml is green. $url"
               exit 1 ;;
          esac
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          # The release is the newest tag: release.yml tags a commit of master, so every tag lies in
          # master's history and the newest one is the current release - even after master has moved
          # on. An annotated tag names its own object in the API's list; ls-remote peels it (the ^{}
          # line names the commit), so the peeled names are what versions are read from.
          tag=$(git ls-remote --tags "https://github.com/$TEMPLATE_REPO" 'v*'             | awk '{ n = $2; sub(/^refs\/tags\//, "", n); sub(/\^\{\}$/, "", n); if (n != "") print n }'             | sort -Vu | tail -1)
          here=$(cat template-version 2>/dev/null || echo none)
          echo "the newest release is ${tag:-(none yet)}, release samples from $here"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          todo='[]'
          for row in $(jq -c '.[] | select(.tag != false) | {branch, ref}' .samples/variants.json); do
            branch=$(jq -r .branch <<< "$row"); ref=$(jq -r '.ref // empty' <<< "$row")
            if [ -n "$ref" ]; then
              # A branch of the template: regenerated when that branch has moved.
              want=$(gh api "repos/$TEMPLATE_REPO/commits/$ref" -q .sha)
              have=$(gh api "repos/$GITHUB_REPOSITORY/contents/template-version?ref=$branch" -q .content 2>/dev/null | base64 -d || echo none)
              from="$ref"
            else
              [ -n "$tag" ] || { echo "$branch: waits for master to be tagged"; continue; }
              want="$tag"; have="$here"; from="$tag"
            fi
            echo "$branch: $have -> $want"
            if [ "$want" != "$have" ] || [ "$FORCE" = "true" ]; then
              todo=$(jq -c --arg b "$branch" --arg f "$from" '. + [{branch: $b, from: $f}]' <<< "$todo")
            fi
          done
          echo "branches=$todo" >> "$GITHUB_OUTPUT"
          [ "$todo" != "[]" ] && echo "regenerate=true" >> "$GITHUB_OUTPUT" || echo "regenerate=false" >> "$GITHUB_OUTPUT"

  regenerate:
    needs: check
    if: needs.check.outputs.regenerate == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.branches) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash automation/.samples/generate.sh "${{ matrix.from }}" "${{ matrix.branch }}" "$RUNNER_TEMP/sample"

      - name: Replace the branch
        env:
          DEPLOY_KEY: ${{ secrets.SAMPLES_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key" && chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q "git@github.com:${GITHUB_REPOSITORY}.git" branch
          cd branch
          # The exact ref: a bare name matches by its tail, and a pull request's branch such as
          # feat/full-alt would pass for full-alt.
          if git ls-remote --exit-code origin "refs/heads/${{ matrix.branch }}" >/dev/null; then
            git checkout -q "${{ matrix.branch }}"
          else
            git checkout -q --orphan "${{ matrix.branch }}"
          fi
          git rm -rqf . 2>/dev/null || true
          # The reports of earlier runs stay: they are the branch's history, which the site shows.
          git checkout -q HEAD -- reports 2>/dev/null || true
          cp -a "$RUNNER_TEMP/sample/." .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Generated from DotNetSolutionKit ${{ matrix.from }}"
          git push -q origin "${{ matrix.branch }}"

      # The report of this run belongs to the branch rebuilt here, not to the default branch the run is on
      # (report.yml). Last step of the job, so job.status is this branch's own result: a branch that failed
      # to rebuild turns red in its own row, and a run that rebuilt three branches with one of them red
      # does not paint all three.
      - name: Name the branch and the result for the report
        if: always()
        run: echo "${{ matrix.branch }} ${{ job.status }}" > "$RUNNER_TEMP/sample-branch.txt"

      - name: Keep it for the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-branch-${{ matrix.branch }}
          path: ${{ runner.temp }}/sample-branch.txt
          retention-days: 1
