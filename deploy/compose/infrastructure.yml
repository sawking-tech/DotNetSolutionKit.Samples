# What the services need from outside: the database, and RabbitMQ when a service uses the bus.
# Started by deploy/compose/compose.sh together with every service's src/services/*/deploy/compose.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      # Passed rather than read from a file: on Docker Desktop for Windows the broker cannot set the
      # permissions it requires on a generated cookie file and stops.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in deploy/compose/.env}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12


  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in deploy/compose/.env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-app}
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage. SeaweedFS (Apache 2.0): MinIO no longer publishes images.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-app}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in deploy/compose/.env}
    volumes:
      - s3:/data

  # Creates the bucket once the storage answers, then exits.
  s3-bucket:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - s3
    entrypoint: ["sh", "-c", "until echo \"s3.bucket.create -name $${BUCKET}\" | weed shell -master=s3:9333 2>&1 | grep -qE 'created|exists'; do sleep 2; done"]
    environment:
      BUCKET: ${S3_BUCKET:-app}

volumes:
  postgres:
  rabbitmq:
  clickhouse:
  s3:
