# This service on Kubernetes; applied by deploy/k8s/apply.sh, which fills in __REGISTRY__ and __TAG__.
# The database, the broker and the secret store live outside the cluster's manifests: their addresses and
# credentials come from the Secret named below, created by whoever runs the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app: billing
spec:
  replicas: 2
  # A new pod takes traffic only once it is ready, and an old one leaves only after that: no gap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: billing
          image: __REGISTRY__/dotnetsolutionkit_samples-billing:__TAG__
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          # ConnectionStrings__DefaultConnection, InternalApi__ApiKey and the other settings, as
          # environment variables. Optional, so the pod starts and reports what is missing.
          envFrom:
            - secretRef:
                name: billing
                optional: true
          # Ready: the database and the broker answer; traffic waits for it.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Alive: the process answers; a database outage must not restart it.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  labels:
    app: billing
spec:
  selector:
    app: billing
  ports:
    - name: http
      port: 80
      targetPort: http
